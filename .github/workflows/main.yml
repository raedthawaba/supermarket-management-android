- name: Build Android APK (Fixed Version)
  run: |
    export ANDROID_HOME=${{ env.ANDROID_HOME }}
    export ANDROID_SDK_ROOT=${{ env.ANDROID_SDK_ROOT }}
    export PATH=$PATH:$ANDROID_HOME/build-tools/34.0.0
    
    echo "🔧 Final environment configuration:"
    echo "ANDROID_HOME: $ANDROID_HOME"
    echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
    echo "PATH: $PATH"
    
    # Verify critical tools
    echo "🔍 Tool verification:"
    which aidl && echo "✅ AIDL found" || echo "❌ AIDL missing"
    which aapt && echo "✅ AAPT found" || echo "❌ AAPT missing"
    which zipalign && echo "✅ zipalign found" || echo "❌ zipalign missing"
    
    # Create android directory with fixed buildozer.spec
    mkdir -p android
    cat > android/buildozer.spec << 'EOF'
[app]

title = نظام السوبر ماركت
package.name = supermarket
package.domain = com.supermarket
source.dir = .
source.include_exts = py,png,jpg,kv,atlas,wav,ttf
version = 1.0.0
requirements = python3,kivy==2.3.1,kivymd==1.2.0,pillow,sqlite3
orientation = portrait

[buildozer]

log_level = 2
warn_on_root = 1

[android]

# FORCE SPECIFIC VERSIONS TO AVOID LICENSE ISSUES
android.ndk = 25.2.9519653
android.sdk = 33
android.build_tools = 34.0.0
android.archs = arm64-v8a,armeabi-v7a
android.enable_androidx = False

# PREVENT AUTO-DOWNLOAD OF NEW VERSIONS
android.skip_update = True
android.accept_sdk_license = True

EOF

    # Copy Python files
    cp *.py android/ 2>/dev/null || echo "📁 No Python files to copy"
    
    cd android
    
    # Clean any previous builds
    echo "🧹 Cleaning previous builds..."
    buildozer android clean
    
    # Build with verbose output
    echo "🚀 Starting build..."
    buildozer android debug 2>&1 | tee build.log
    
    # Check if APK was created
    if find . -name "*.apk" -type f | grep -q .; then
        echo "🎉 APK built successfully!"
        find . -name "*.apk" -type f -exec ls -la {} \;
    else
        echo "❌ Build failed - checking logs..."
        if [ -f "buildozer.log" ]; then
            echo "=== buildozer.log ==="
            tail -100 buildozer.log
        fi
        if [ -f "build.log" ]; then
            echo "=== build.log ==="
            tail -50 build.log
        fi
        exit 1
    fi
