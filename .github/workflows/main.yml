name: Build Android APK
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_android.txt 2>/dev/null || echo "requirements_android.txt not found"
        pip install setuptools cython
        pip install buildozer
    
    - name: Install Java JDK 17
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk
        java -version
        javac -version
    
    - name: Install Android SDK (Ultimate Fix Method)
      run: |
        # Create SDK directory
        mkdir -p android-sdk
        cd android-sdk
        
        # Download command line tools
        echo "📦 Downloading Android SDK command line tools..."
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        
        # Set up environment
        export ANDROID_HOME=$PWD
        export PATH=$PATH:$PWD/cmdline-tools/latest/bin
        echo "ANDROID_HOME=$PWD" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$PWD" >> $GITHUB_ENV
        
        # CRITICAL: Comprehensive license acceptance
        echo "🔑 Accepting Android SDK licenses (comprehensive)..."
        (
          echo "y"
          echo "y"
          echo "y"
          echo "y"
          echo "y"
          echo "y"
          echo "y"
          echo "y"
          echo "y"
          echo "y"
          echo "y"
          echo "y"
          echo "y"
          echo "y"
          echo "y"
        ) | sdkmanager --sdk_root=$PWD --licenses || true
        echo "✅ License acceptance completed"
        
        # Update SDK repository
        echo "📈 Updating SDK repository..."
        sdkmanager --sdk_root=$PWD --update
        
        # List available packages
        echo "📋 Available build-tools packages:"
        sdkmanager --sdk_root=$PWD --list | grep "build-tools" || echo "No build-tools found in list"
        
        # CRITICAL: Install build-tools with multiple approaches
        echo "🛠️ Installing build-tools with ultimate approach..."
        
        # Approach 1: Install specific stable version
        echo "🔸 Approach 1: Installing build-tools;35.0.0..."
        (
          echo "y" && sdkmanager --sdk_root=$PWD "build-tools;35.0.0" --licenses all
        ) && echo "✅ build-tools;35.0.0 installed" || {
          echo "❌ Approach 1 failed"
          
          # Approach 2: Install another stable version
          echo "🔸 Approach 2: Installing build-tools;34.0.0..."
          (
            echo "y" && sdkmanager --sdk_root=$PWD "build-tools;34.0.0" --licenses all
          ) && echo "✅ build-tools;34.0.0 installed" || {
            echo "❌ Approach 2 failed"
            
            # Approach 3: Try without specific version
            echo "🔸 Approach 3: Installing latest build-tools..."
            (
              echo "y" && sdkmanager --sdk_root=$PWD "build-tools" --licenses all
            ) && echo "✅ Latest build-tools installed" || {
              echo "❌ Approach 3 failed"
              
              # Approach 4: Let buildozer handle it
              echo "🔸 Approach 4: Using buildozer's automatic installation..."
              cd /tmp
              echo "y" | buildozer android clean > /dev/null 2>&1 || true
              echo "y" | buildozer android init > /dev/null 2>&1 || true
              
              # Copy from buildozer if successful
              if [ -d "/home/runner/.buildozer/android/platform/android-sdk/build-tools" ]; then
                cp -r /home/runner/.buildozer/android/platform/android-sdk/build-tools $ANDROID_HOME/
                echo "✅ Copied build-tools from buildozer"
              else
                echo "❌ buildozer installation also failed"
              fi
            }
          }
        }
        
        # Verify installation
        if [ -d "$ANDROID_HOME/build-tools" ]; then
          echo "✅ build-tools directory exists!"
          ls -la $ANDROID_HOME/build-tools/
          
          # Find and setup PATH for build-tools
          for dir in $ANDROID_HOME/build-tools/*/; do
            if [ -d "$dir" ]; then
              version=$(basename "$dir")
              echo "📁 Found build-tools version: $version"
              
              # Check for critical tools
              if [ -f "$dir/aidl" ]; then
                echo "✅ AIDL found in $version"
                export PATH=$PATH:$dir
              fi
              if [ -f "$dir/zipalign" ]; then
                echo "✅ zipalign found in $version"
              fi
              if [ -f "$dir/aapt" ] || [ -f "$dir/aapt2" ]; then
                echo "✅ AAPT found in $version"
              fi
            fi
          done
          
          echo "PATH=$PATH" >> $GITHUB_ENV
        else
          echo "⚠️ No build-tools directory created"
          
          # Create minimal fallback
          echo "🔧 Creating minimal build-tools structure..."
          mkdir -p $ANDROID_HOME/build-tools/33.0.2
          
          # Try to find and copy aidl from system
          SYSTEM_AIDL=$(find /usr -name "aidl" -type f 2>/dev/null | head -1)
          if [ -n "$SYSTEM_AIDL" ] && [ -f "$SYSTEM_AIDL" ]; then
            cp "$SYSTEM_AIDL" $ANDROID_HOME/build-tools/33.0.2/
            chmod +x $ANDROID_HOME/build-tools/33.0.2/aidl
            echo "✅ Copied system aidl to build-tools"
            export PATH=$PATH:$ANDROID_HOME/build-tools/33.0.2
          fi
        fi
        
        # Install core packages
        echo "📱 Installing core packages..."
        sdkmanager --sdk_root=$PWD "platform-tools"
        sdkmanager --sdk_root=$PWD "platforms;android-33"
        sdkmanager --sdk_root=$PWD "system-images;android-33;google_apis;x86_64"
        sdkmanager --sdk_root=$PWD "ndk;26.2.11394342"
        sdkmanager --sdk_root=$PWD "cmake;3.22.1"
        
        # Final verification
        echo "🔍 Final verification..."
        sdkmanager --sdk_root=$PWD --list_installed | grep -E "(build-tools|platform-tools|platforms)"
    
    - name: Install system dependencies (Ubuntu 24.04 Compatible)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libncurses6 \
          libstdc++6 \
          libgtk-3-0 \
          libx11-xcb1 \
          libxcb-dri3-0 \
          libxcomposite1 \
          libxdamage1 \
          libxrandr2 \
          libgbm1 \
          libxss1 \
          libasound2t64 \
          unzip \
          python3-setuptools
    
    - name: Create buildozer configuration
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        
        title = نظام السوبر ماركت
        package.name = supermarket
        package.domain = com.supermarket
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,wav,ttf
        version = 1.0.0
        requirements = python3,kivy==2.3.1,kivymd==1.2.0,pillow,sqlite3
        orientation = portrait
        
        [buildozer]
        
        log_level = 2
        warn_on_root = 1
        
        [android]
        
        android.ndk = 26.2.11394342
        android.sdk = 33
        android.archs = arm64-v8a,armeabi-v7a
        android.enable_androidx = False
        
        EOF
    
    - name: Build Android APK (Ultimate Method)
      run: |
        export ANDROID_HOME=${{ env.ANDROID_HOME }}
        export ANDROID_SDK_ROOT=${{ env.ANDROID_SDK_ROOT }}
        
        echo "🔧 Environment setup:"
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
        echo "PATH: $PATH"
        
        # Verify critical tools before build
        echo "🔍 Pre-build verification:"
        which aidl && echo "✅ AIDL found" || echo "❌ AIDL not found"
        which zipalign && echo "✅ zipalign found" || echo "❌ zipalign not found"
        which aapt && echo "✅ AAPT found" || echo "❌ AAPT not found"
        
        # Create android directory
        mkdir -p android
        cp buildozer.spec android/
        cp *.py android/ 2>/dev/null || echo "📝 No Python files to copy"
        
        echo "Android directory contents:"
        ls -la android/
        
        # Final build attempt
        cd android
        echo "🚀 Starting ultimate buildozer build..."
        
        # Try with verbose first, then fallback to standard
        if buildozer android debug --verbose; then
          echo "✅ Build successful with verbose mode!"
        else
          echo "🔄 Verbose failed, trying standard mode..."
          if buildozer android debug; then
            echo "✅ Build successful with standard mode!"
          else
            echo "❌ Both build modes failed"
            echo "🔍 Build logs:"
            cat buildozer.log 2>/dev/null || echo "No buildozer.log found"
            exit 1
          fi
        fi
        
        # Check for APK
        echo "🔍 Looking for APK files..."
        find . -name "*.apk" -type f -exec ls -la {} \;
        
        if [ -f "bin/supermarket-1.0.0-debug.apk" ]; then
          echo "🎉 SUCCESS! APK created:"
          ls -la bin/supermarket-1.0.0-debug.apk
        elif [ -f "bin/*.apk" ]; then
          echo "🎉 SUCCESS! APK found:"
          ls -la bin/*.apk
        else
          echo "⚠️ APK not found in expected location"
          echo "🔍 Searching entire directory:"
          find . -name "*.apk" -type f
        fi
    
    - name: Upload APK artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: supermarket-android-apk
        path: |
          android/bin/*.apk
          android/app/build/outputs/apk/debug/*.apk
        retention-days: 7
