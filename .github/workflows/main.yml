name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_android.txt 2>/dev/null || echo "requirements_android.txt not found"
        pip install setuptools cython
        pip install buildozer
    
    - name: Install Java JDK 17
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk
        java -version
        javac -version
    
    - name: Install Android SDK with BuildTools Support
      run: |
        # Create SDK directory
        mkdir -p android-sdk
        cd android-sdk
        
        # Download command line tools
        echo "Downloading Android SDK command line tools..."
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        
        # Set up environment
        export ANDROID_HOME=$PWD
        export PATH=$PATH:$PWD/cmdline-tools/latest/bin:$PWD/platform-tools
        echo "ANDROID_HOME=$PWD" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$PWD" >> $GITHUB_ENV
        echo "PATH=$PATH" >> $GITHUB_ENV
        
        # CRITICAL: ACCEPT ALL LICENSES FORCEFULLY AND COMPLETELY
        echo "======================================"
        echo "🚨 ACCEPTING ALL ANDROID LICENSES 🚨"
        echo "======================================"
        
        # Method 1: Use sdkmanager --licenses with input
        (
          while true; do
            echo "y"
          done
        ) | sdkmanager --sdk_root=$PWD --licenses
        
        # Method 2: Alternative license acceptance
        yes "" | sdkmanager --sdk_root=$PWD --licenses || true
        
        # Method 3: Force accept using echo commands
        echo "y" | yes | sdkmanager --sdk_root=$PWD --licenses || true
        echo "yes" | yes | sdkmanager --sdk_root=$PWD --licenses || true
        
        echo "✅ License acceptance completed"
        
        # Update SDK
        echo "Updating SDK..."
        sdkmanager --sdk_root=$PWD --update
        
        # Install packages - START WITH BUILD-TOOLS 36.1.0
        echo "Installing Android SDK components..."
        sdkmanager --sdk_root=$PWD "platform-tools"
        sdkmanager --sdk_root=$PWD "platforms;android-33"
        
        # CRITICAL: Explicitly accept license for build-tools 36.1.0
        echo "======================================"
        echo "🚨 ACCEPTING BUILD-TOOLS 36.1.0 LICENSE 🚨"
        echo "======================================"
        
        # Force accept license before installation
        (
          echo "y"
          sleep 1
          echo "y"
          sleep 1
          echo "y"
        ) | sdkmanager --sdk_root=$PWD "build-tools;36.1.0"
        
        # If the above failed, try different approach
        if [ ! -d "$ANDROID_HOME/build-tools/36.1.0" ]; then
          echo "⚠️  First method failed, trying alternative approach..."
          
          # Accept license using echo commands
          echo -e "y\ny\ny\ny\ny\ny\ny\ny\ny\ny" | sdkmanager --sdk_root=$PWD "build-tools;36.1.0"
          
          # Alternative: Try installing without version specification first
          sdkmanager --sdk_root=$PWD "build-tools"
        fi
        
        # Install other components
        sdkmanager --sdk_root=$PWD "system-images;android-33;google_apis;x86_64"
        sdkmanager --sdk_root=$PWD "ndk;26.2.11394342"
        sdkmanager --sdk_root=$PWD "cmake;3.22.1"
        
        # Verify installation
        echo "Verifying SDK installation..."
        sdkmanager --sdk_root=$PWD --list_installed
        
        # CRITICAL: Detailed build-tools verification
        echo "======================================"
        echo "🔍 VERIFYING BUILD-TOOLS INSTALLATION"
        echo "======================================"
        
        if [ -d "$ANDROID_HOME/build-tools" ]; then
          echo "✅ build-tools directory found"
          ls -la $ANDROID_HOME/build-tools/
          
          # Check for 36.1.0 specifically
          if [ -d "$ANDROID_HOME/build-tools/36.1.0" ]; then
            echo "✅ build-tools;36.1.0: CONFIRMED"
            
            # Check for AIDL
            if [ -f "$ANDROID_HOME/build-tools/36.1.0/aidl" ]; then
              echo "✅ AIDL: FOUND in build-tools;36.1.0"
              echo "📍 AIDL path: $ANDROID_HOME/build-tools/36.1.0/aidl"
              
              # Test AIDL
              if "$ANDROID_HOME/build-tools/36.1.0/aidl" --help >/dev/null 2>&1; then
                echo "✅ AIDL: EXECUTABLE"
              else
                echo "⚠️  AIDL found but might not be executable"
              fi
            else
              echo "❌ AIDL NOT FOUND in build-tools;36.1.0"
              # Search for AIDL in all build-tools versions
              find $ANDROID_HOME/build-tools -name "aidl" -type f
            fi
          else
            echo "❌ build-tools;36.1.0 NOT FOUND"
            
            # List available build-tools versions
            echo "Available build-tools versions:"
            ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No versions found"
            
            # Find any AIDL anywhere
            AIDL_PATH=$(find $ANDROID_HOME/build-tools -name "aidl" -type f 2>/dev/null | head -n1)
            if [ -n "$AIDL_PATH" ]; then
              echo "✅ AIDL found at: $AIDL_PATH"
            else
              echo "❌ AIDL NOT FOUND ANYWHERE"
              exit 1
            fi
          fi
        else
          echo "❌ build-tools directory MISSING"
          exit 1
        fi
        
        echo "✅ Build-tools verification completed"
    
    - name: Set up Android environment
      run: |
        export ANDROID_HOME=${{ env.ANDROID_HOME }}
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
        
        # CRITICAL: Add build-tools 36.1.0 to PATH if it exists
        if [ -d "$ANDROID_HOME/build-tools/36.1.0" ]; then
          echo "PATH=$PATH:$ANDROID_HOME/build-tools/36.1.0" >> $GITHUB_ENV
          echo "🔧 Added build-tools;36.1.0 to PATH"
        else
          # Find any available build-tools version
          BUILD_TOOLS_VERSION=$(ls $ANDROID_HOME/build-tools/ 2>/dev/null | head -n1)
          if [ -n "$BUILD_TOOLS_VERSION" ]; then
            echo "PATH=$PATH:$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" >> $GITHUB_ENV
            echo "🔧 Added build-tools;$BUILD_TOOLS_VERSION to PATH"
          fi
        fi
    
    - name: Verify Android components (ULTIMATE CHECK)
      run: |
        export ANDROID_HOME=${{ env.ANDROID_HOME }}
        export ANDROID_NDK_HOME=${{ env.ANDROID_NDK_HOME }}
        
        echo "🔍 ULTIMATE VERIFICATION OF ANDROID COMPONENTS"
        echo "============================================="
        
        # Find AIDL regardless of version
        AIDL_PATH=""
        for build_tools_dir in $ANDROID_HOME/build-tools/*/; do
          if [ -d "$build_tools_dir" ] && [ -f "$build_tools_dir/aidl" ]; then
            version=$(basename "$build_tools_dir")
            echo "✅ AIDL: FOUND in build-tools;$version"
            echo "📍 AIDL path: $build_tools_dir/aidl"
            
            # Test AIDL execution
            if "$build_tools_dir/aidl" --help >/dev/null 2>&1; then
              echo "✅ AIDL: EXECUTABLE"
              AIDL_PATH="$build_tools_dir"
            else
              echo "⚠️  AIDL: Found but not executable"
              AIDL_PATH="$build_tools_dir"
            fi
            break
          fi
        done
        
        if [ -z "$AIDL_PATH" ]; then
          echo "❌ AIDL: NOT FOUND ANYWHERE - CRITICAL ERROR"
          echo "🔍 Searching entire Android SDK for AIDL..."
          find $ANDROID_HOME -name "aidl" -type f 2>/dev/null
          exit 1
        fi
        
        # Check NDK
        if [ -d "$ANDROID_NDK_HOME" ]; then
          echo "✅ NDK: OK"
        else
          echo "❌ NDK: MISSING"
          exit 1
        fi
        
        echo "✅ ALL COMPONENTS VERIFIED - AIDL LOCATED: $AIDL_PATH"
    
    - name: Install system dependencies (Ubuntu 24.04 Compatible)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libncurses6 \
          libstdc++6 \
          libgtk-3-0 \
          libx11-xcb1 \
          libxcb-dri3-0 \
          libxcomposite1 \
          libxdamage1 \
          libxrandr2 \
          libgbm1 \
          libxss1 \
          libasound2t64 \
          unzip \
          python3-setuptools
        # Note: python3-distutils removed - not needed in Ubuntu 24.04
    
    - name: Create buildozer configuration
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        
        title = نظام السوبر ماركت
        package.name = supermarket
        package.domain = com.supermarket
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,wav,ttf
        version = 1.0.0
        requirements = python3,kivy==2.3.1,kivymd==1.2.0,pillow,sqlite3
        orientation = portrait
        
        [buildozer]
        
        log_level = 2
        warn_on_root = 1
        
        [android]
        
        android.ndk = 26.2.11394342
        android.sdk = 33
        android.archs = arm64-v8a,armeabi-v7a
        android.enable_androidx = False
        
        EOF
        
        echo "✅ buildozer.spec created"
    
    - name: Build Android APK (AIDL-GUARANTEED)
      run: |
        export ANDROID_HOME=${{ env.ANDROID_HOME }}
        export ANDROID_NDK_HOME=${{ env.ANDROID_NDK_HOME }}
        
        echo "🚀 STARTING APK BUILD WITH AIDL GUARANTEE"
        echo "========================================="
        
        # ULTIMATE: Find and set AIDL path explicitly
        AIDL_PATH=""
        for build_tools_dir in $ANDROID_HOME/build-tools/*/; do
          if [ -d "$build_tools_dir" ] && [ -f "$build_tools_dir/aidl" ]; then
            version=$(basename "$build_tools_dir")
            echo "🔧 Found build-tools;$version"
            echo "🔧 AIDL path: $build_tools_dir/aidl"
            AIDL_PATH="$build_tools_dir"
            break
          fi
        done
        
        if [ -z "$AIDL_PATH" ]; then
          echo "❌ CRITICAL ERROR: AIDL not found anywhere"
          find $ANDROID_HOME -name "aidl" -type f
          exit 1
        fi
        
        # Add AIDL directory to PATH explicitly
        export PATH=$PATH:$AIDL_PATH
        echo "🔧 Added $AIDL_PATH to PATH"
        
        # Verify AIDL is now accessible
        if command -v aidl >/dev/null 2>&1; then
          echo "✅ AIDL is now accessible in PATH"
          aidl --help | head -n5
        else
          echo "❌ AIDL still not accessible"
          echo "🔍 AIDL location: $AIDL_PATH"
          echo "🔍 Current PATH: $PATH"
          
          # Direct execution attempt
          if [ -x "$AIDL_PATH/aidl" ]; then
            echo "✅ AIDL is executable directly: $AIDL_PATH/aidl"
          else
            echo "❌ AIDL not executable"
            exit 1
          fi
        fi
        
        # Create android directory
        mkdir -p android
        cp buildozer.spec android/
        
        # Copy source files
        cp *.py android/ 2>/dev/null || echo "No Python files found"
        
        echo "Android directory contents:"
        ls -la android/
        
        # Build APK with full verbosity to catch any AIDL issues
        cd android
        echo "🔨 Starting buildozer with full verbosity..."
        buildozer android debug --verbose || {
          echo "❌ Build failed, trying to diagnose AIDL issues..."
          which aidl || echo "AIDL not in PATH"
          ls -la $ANDROID_HOME/build-tools/*/aidl || echo "AIDL files not found"
          exit 1
        }
        
        echo "✅ BUILD COMPLETED"
    
    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: android/bin/*.apk
        retention-days: 30
    
    - name: Build summary
      if: always()
      run: |
        echo "📱 BUILD SUMMARY"
        echo "================"
        
        if [ -d "android/bin" ] && [ -f "android/bin/"*.apk ]; then
          echo "✅ APK SUCCESS"
          ls -lah android/bin/*.apk
        else
          echo "❌ APK FAILED"
          echo "Checking android directory contents:"
          ls -la android/ 2>/dev/null || echo "Android directory not found"
        fi
        
        echo "================"
        echo "Build completed at: $(date)"
