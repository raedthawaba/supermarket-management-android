name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_android.txt 2>/dev/null || echo "requirements_android.txt not found"
        pip install setuptools cython
        pip install buildozer
    
    - name: Install Java JDK 17
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk
        java -version
        javac -version
    
    - name: Install Android SDK with BuildTools Support
      run: |
        # Create SDK directory
        mkdir -p android-sdk
        cd android-sdk
        
        # Download command line tools
        echo "Downloading Android SDK command line tools..."
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        
        # Set up environment
        export ANDROID_HOME=$PWD
        export PATH=$PATH:$PWD/cmdline-tools/latest/bin:$PWD/platform-tools
        echo "ANDROID_HOME=$PWD" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$PWD" >> $GITHUB_ENV
        echo "PATH=$PATH" >> $GITHUB_ENV
        
        # Accept licenses - COMPREHENSIVE ACCEPTANCE
        echo "Accepting all licenses comprehensively..."
        yes | sdkmanager --sdk_root=$PWD --licenses
        echo "y" | sdkmanager --sdk_root=$PWD --licenses
        echo -e "\n" | sdkmanager --sdk_root=$PWD --licenses
        
        # Update SDK
        echo "Updating SDK..."
        sdkmanager --sdk_root=$PWD --update
        
        # Install packages - FORCE SPECIFIC VERSION
        echo "Installing Android SDK components..."
        sdkmanager --sdk_root=$PWD "platform-tools"
        sdkmanager --sdk_root=$PWD "platforms;android-33"
        
        # CRITICAL: Force build-tools version to avoid license issues
        echo "Installing build-tools with explicit version control..."
        
        # First, try specific known working version
        if sdkmanager --sdk_root=$PWD "build-tools;33.0.2"; then
          echo "✅ build-tools;33.0.2 installed successfully"
        else
          echo "⚠️  build-tools;33.0.2 failed, trying alternative approach..."
          
          # Accept ALL licenses for all possible versions
          echo "Accepting ALL licenses for all versions..."
          for version in 36.1.0 34.0.0 33.0.2 33.0.1 33.0.0; do
            echo "y" | sdkmanager --sdk_root=$PWD "build-tools;${version}"
          done
          
          # Try latest version after license acceptance
          sdkmanager --sdk_root=$PWD "build-tools;36.1.0"
        fi
        
        sdkmanager --sdk_root=$PWD "system-images;android-33;google_apis;x86_64"
        sdkmanager --sdk_root=$PWD "ndk;26.2.11394342"
        sdkmanager --sdk_root=$PWD "cmake;3.22.1"
        
        # Verify installation
        echo "Verifying SDK installation..."
        sdkmanager --sdk_root=$PWD --list_installed
        
        # Check build-tools with detailed verification
        if [ -d "$ANDROID_HOME/build-tools" ]; then
          echo "✅ build-tools directory found"
          ls -la $ANDROID_HOME/build-tools/
          
          # Find the actual build-tools version installed
          BUILD_TOOLS_VERSION=$(ls $ANDROID_HOME/build-tools/ | head -n1)
          echo "📦 Installed build-tools version: $BUILD_TOOLS_VERSION"
          
          # Check for AIDL in the installed version
          if [ -f "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aidl" ]; then
            echo "✅ AIDL tool found at: $ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aidl"
          else
            echo "❌ AIDL tool NOT found in build-tools;$BUILD_TOOLS_VERSION"
            echo "🔍 Searching for AIDL in all build-tools directories..."
            find $ANDROID_HOME/build-tools -name "aidl" -type f 2>/dev/null || echo "AIDL not found anywhere"
          fi
        else
          echo "❌ build-tools directory missing"
          exit 1
        fi
    
    - name: Set up Android environment
      run: |
        export ANDROID_HOME=${{ env.ANDROID_HOME }}
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
        echo "PATH=$PATH:$ANDROID_NDK_HOME" >> $GITHUB_ENV
        
        # CRITICAL: Add build-tools to PATH after verification
        BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -type d -name "*.*.*" | head -n1)
        if [ -n "$BUILD_TOOLS_DIR" ]; then
          BUILD_TOOLS_VERSION=$(basename "$BUILD_TOOLS_DIR")
          echo "PATH=$PATH:$BUILD_TOOLS_DIR" >> $GITHUB_ENV
          echo "🔧 Added build-tools;$BUILD_TOOLS_VERSION to PATH"
        fi
    
    - name: Verify Android components (FINAL CHECK)
      run: |
        export ANDROID_HOME=${{ env.ANDROID_HOME }}
        export ANDROID_NDK_HOME=${{ env.ANDROID_NDK_HOME }}
        
        echo "🔍 FINAL VERIFICATION OF ANDROID COMPONENTS"
        echo "============================================="
        
        # Check build-tools
        if [ -d "$ANDROID_HOME/build-tools" ]; then
          echo "✅ build-tools: OK"
          ls -la $ANDROID_HOME/build-tools/
          
          # Find and test AIDL - COMPREHENSIVE SEARCH
          AIDL_FOUND=false
          for build_tools_dir in $ANDROID_HOME/build-tools/*/; do
            if [ -d "$build_tools_dir" ]; then
              version=$(basename "$build_tools_dir")
              if [ -f "$build_tools_dir/aidl" ]; then
                echo "✅ AIDL: FOUND in build-tools;$version"
                echo "📍 AIDL path: $build_tools_dir/aidl"
                
                # Test AIDL execution
                if "$build_tools_dir/aidl" --help >/dev/null 2>&1; then
                  echo "✅ AIDL: EXECUTABLE"
                  AIDL_FOUND=true
                else
                  echo "⚠️  AIDL: Found but not executable"
                fi
              fi
            fi
          done
          
          if [ "$AIDL_FOUND" = false ]; then
            echo "❌ AIDL: NOT FOUND ANYWHERE - THIS WILL CAUSE BUILD FAILURE"
            exit 1
          fi
        else
          echo "❌ build-tools: MISSING"
          exit 1
        fi
        
        # Check NDK
        if [ -d "$ANDROID_NDK_HOME" ]; then
          echo "✅ NDK: OK"
        else
          echo "❌ NDK: MISSING"
          exit 1
        fi
        
        echo "✅ ALL COMPONENTS VERIFIED - READY FOR BUILD"
    
    - name: Install system dependencies (Ubuntu 24.04 Compatible)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libncurses6 \
          libstdc++6 \
          libgtk-3-0 \
          libx11-xcb1 \
          libxcb-dri3-0 \
          libxcomposite1 \
          libxdamage1 \
          libxrandr2 \
          libgbm1 \
          libxss1 \
          libasound2t64 \
          unzip \
          python3-setuptools
        # Note: python3-distutils removed - not needed in Ubuntu 24.04
        # distutils functionality is included in python3-setuptools
    
    - name: Create buildozer configuration
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        
        title = نظام السوبر ماركت
        package.name = supermarket
        package.domain = com.supermarket
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,wav,ttf
        version = 1.0.0
        requirements = python3,kivy==2.3.1,kivymd==1.2.0,pillow,sqlite3
        orientation = portrait
        
        [buildozer]
        
        log_level = 2
        warn_on_root = 1
        
        [android]
        
        android.ndk = 26.2.11394342
        android.sdk = 33
        android.archs = arm64-v8a,armeabi-v7a
        android.enable_androidx = False
        
        EOF
        
        echo "✅ buildozer.spec created"
    
    - name: Build Android APK
      run: |
        export ANDROID_HOME=${{ env.ANDROID_HOME }}
        export ANDROID_NDK_HOME=${{ env.ANDROID_NDK_HOME }}
        
        echo "🚀 STARTING APK BUILD"
        echo "===================="
        
        # CRITICAL: Ensure AIDL is in PATH
        for build_tools_dir in $ANDROID_HOME/build-tools/*/; do
          if [ -d "$build_tools_dir" ] && [ -f "$build_tools_dir/aidl" ]; then
            version=$(basename "$build_tools_dir")
            echo "🔧 Adding build-tools;$version to PATH"
            export PATH=$PATH:$build_tools_dir
          fi
        done
        
        # Verify AIDL is accessible
        if command -v aidl >/dev/null 2>&1; then
          echo "✅ AIDL is accessible in PATH"
          aidl --help | head -n5
        else
          echo "❌ AIDL is NOT accessible in PATH"
          echo "🔍 Searching for AIDL manually..."
          find $ANDROID_HOME -name "aidl" -type f
          exit 1
        fi
        
        # Create android directory
        mkdir -p android
        cp buildozer.spec android/
        
        # Copy source files
        cp *.py android/ 2>/dev/null || echo "No Python files found"
        
        echo "Android directory contents:"
        ls -la android/
        
        # Build APK
        cd android
        buildozer android debug --verbose
        
        echo "✅ BUILD COMPLETED"
    
    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: android/bin/*.apk
        retention-days: 30
    
    - name: Build summary
      if: always()
      run: |
        echo "📱 BUILD SUMMARY"
        echo "================"
        
        if [ -d "android/bin" ] && [ -f "android/bin/"*.apk ]; then
          echo "✅ APK SUCCESS"
          ls -lah android/bin/*.apk
        else
          echo "❌ APK FAILED"
        fi
        
        echo "================"
        echo "Build completed at: $(date)"
