name: Minimal Android Build
on: push: branches: [ main ]
jobs: build: runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- name: Setup Python
  uses: actions/setup-python@v4 with: python-version: '3.12'
- name: Install buildozer
  run: |
    sudo apt-get update
    sudo apt-get install -y openjdk-17-jdk
    pip install buildozer
- name: Simple build
  run: |
    echo "[app]
title =超市应用
package.name = supermarket
package.domain = com.supermarket
source.dir = .
version = 1.0.0
requirements = python3,kivy" > buildozer.spec
    buildozer android debug
- name: Upload APK
  if: always()
  uses: actions/upload-artifact@v4
  with: name: apk path: "**/*.apk"
