name: Build Android APK
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_android.txt 2>/dev/null || echo "requirements_android.txt not found"
        pip install setuptools cython
        pip install buildozer
    
    - name: Install Java JDK 17
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk
        java -version
        javac -version
    
    - name: Install Android SDK (Package-Fixed Method)
      run: |
        # Create SDK directory
        mkdir -p android-sdk
        cd android-sdk
        
        # Download command line tools
        echo "Downloading Android SDK command line tools..."
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        
        # Set up environment
        export ANDROID_HOME=$PWD
        export PATH=$PATH:$PWD/cmdline-tools/latest/bin:$PWD/platform-tools
        echo "ANDROID_HOME=$PWD" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$PWD" >> $GITHUB_ENV
        echo "PATH=$PATH" >> $GITHUB_ENV
        
        # Accept all licenses
        echo "y" | yes | sdkmanager --sdk_root=$PWD --licenses || true
        
        # Update SDK first
        echo "Updating SDK repository..."
        sdkmanager --sdk_root=$PWD --update --sdk_root=$PWD
        
        # List available packages to see what we can install
        echo "Available build-tools packages:"
        sdkmanager --sdk_root=$PWD --list | grep "build-tools"
        
        # Try different build-tools installation approaches
        echo "Installing build-tools with fallback approach..."
        
        # Method 1: Try with specific version
        sdkmanager --sdk_root=$PWD "build-tools;36.1.0" || \
        # Method 2: Try without version (latest)
        sdkmanager --sdk_root=$PWD "build-tools" || \
        # Method 3: Try specific known working versions
        sdkmanager --sdk_root=$PWD "build-tools;35.0.0" || \
        sdkmanager --sdk_root=$PWD "build-tools;34.0.0" || \
        sdkmanager --sdk_root=$PWD "build-tools;33.0.2" || \
        echo "⚠️  All build-tools installation methods failed"
        
        # Always install these core packages that we know work
        echo "Installing core Android packages..."
        sdkmanager --sdk_root=$PWD "platform-tools"
        sdkmanager --sdk_root=$PWD "platforms;android-33"
        sdkmanager --sdk_root=$PWD "system-images;android-33;google_apis;x86_64"
        sdkmanager --sdk_root=$PWD "ndk;26.2.11394342"
        sdkmanager --sdk_root=$PWD "cmake;3.22.1"
        
        # Check what was actually installed
        echo "Verifying installation..."
        sdkmanager --sdk_root=$PWD --list_installed
        
        # Check if any build-tools was installed
        if [ -d "$ANDROID_HOME/build-tools" ]; then
          echo "✅ build-tools directory found!"
          ls -la $ANDROID_HOME/build-tools/
          
          # Add all build-tools to PATH
          for dir in $ANDROID_HOME/build-tools/*/; do
            if [ -d "$dir" ]; then
              version=$(basename "$dir")
              echo "Found build-tools version: $version"
              
              # Check for AIDL
              if [ -f "$dir/aidl" ]; then
                echo "✅ AIDL found in build-tools;$version"
              fi
            fi
          done
        else
          echo "⚠️  No build-tools directory found"
          echo "This might still work if buildozer handles it differently"
        fi
    
    - name: Install system dependencies (Ubuntu 24.04 Compatible)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libncurses6 \
          libstdc++6 \
          libgtk-3-0 \
          libx11-xcb1 \
          libxcb-dri3-0 \
          libxcomposite1 \
          libxdamage1 \
          libxrandr2 \
          libgbm1 \
          libxss1 \
          libasound2t64 \
          unzip \
          python3-setuptools
    
    - name: Create buildozer configuration
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        
        title = نظام السوبر ماركت
        package.name = supermarket
        package.domain = com.supermarket
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,wav,ttf
        version = 1.0.0
        requirements = python3,kivy==2.3.1,kivymd==1.2.0,pillow,sqlite3
        orientation = portrait
        
        [buildozer]
        
        log_level = 2
        warn_on_root = 1
        
        [android]
        
        android.ndk = 26.2.11394342
        android.sdk = 33
        android.archs = arm64-v8a,armeabi-v7a
        android.enable_androidx = False
        
        EOF
    
    - name: Build Android APK (Buildozer-Managed)
      run: |
        export ANDROID_HOME=${{ env.ANDROID_HOME }}
        export ANDROID_SDK_ROOT=${{ env.ANDROID_SDK_ROOT }}
        
        # Set up PATH for all build-tools
        if [ -d "$ANDROID_HOME/build-tools" ]; then
          for dir in $ANDROID_HOME/build-tools/*/; do
            if [ -d "$dir" ]; then
              echo "Adding to PATH: $dir"
              export PATH=$PATH:$dir
            fi
          done
        fi
        
        echo "Final PATH: $PATH"
        
        # Create android directory and setup
        mkdir -p android
        cp buildozer.spec android/
        cp *.py android/ 2>/dev/null || echo "No Python files found"
        
        echo "Android directory contents:"
        ls -la android/
        
        # Let buildozer handle everything - it might download build-tools itself
        cd android
        echo "🚀 Starting buildozer build..."
        buildozer android debug --verbose || {
          echo "❌ Buildozer failed, trying simpler approach..."
          buildozer android debug
        }
        
        echo "✅ Build process completed"
